#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

cache = true
strict_mode = true

[[session]]
name = "dotfiles"
path = "~/dotfiles"
startup_command = "vi"

[[wildcard]]
pattern = "~/fun/*"
windows = ["code", "dev"]

[[wildcard]]
pattern = "~/index/*"
windows = ["code", "dev"]

[[window]]
name = "code"
startup_script = "vi"

[[window]]
name = "dev"
startup_script = "dev"
